<title>Mentally Prepare</title>
<style>
:root{
  --bg:#060410;
  --s1:rgba(255,255,255,0.035);
  --s2:rgba(255,255,255,0.058);
  --bd:rgba(255,255,255,0.075);

  --muted:rgba(240,234,255,0.62);
  --soft:rgba(240,234,255,0.36);
  --rose:#d4859a;
  --rose2:#f0a8be;
  --rg:rgba(212,133,154,0.16);

  --gold:#c9a96e;

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#060410;background-image:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(100,60,160,0.28) 0%,transparent 65%),radial-gradient(ellipse 50% 40% at 85% 90%,rgba(180,90,120,0.14) 0%,transparent 60%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.shell{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse 90% 45% at 50% -5%,rgba(90,50,150,0.22) 0%,transparent 70%),radial-gradient(ellipse 60% 35% at 80% 85%,rgba(180,80,110,0.1) 0%,transparent 60%),#070511}

.st{position:absolute;border-radius:50%;background:#fff}
.neb{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.nob{position:absolute;border-radius:50%;filter:blur(70px)}

.nob:nth-child(2){width:180px;height:180px;background:radial-gradient(circle,rgba(200,100,130,0.15),transparent 70%);bottom:120px;right:-30px}
.nob:nth-child(3){width:140px;height:140px;background:radial-gradient(circle,rgba(190,150,80,0.1),transparent 70%);bottom:-30px;left:80px}

.screen.show{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;flex-shrink:0}
.wm{font-size:13px;letter-spacing:0.06em;color:var(--muted);font-style:italic;font-weight:400}
.pb{padding:7px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:0.07em;text-transform:uppercase;font-family:system-ui,sans-serif;transition:background .2s,border-color .2s}
.pb:hover{background:var(--s2);border-color:var(--bdg)}
.hero{font-size:42px;line-height:1.1;font-weight:700;letter-spacing:-0.02em}
.hero em{font-style:italic;background:linear-gradient(135deg,var(--rose2),var(--gold2),var(--rose2));background-size:200% auto;animation:shine 4s linear infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;display:inline-block;padding-right:0.05em}
@keyframes shine{to{background-position:200% center}}
.hero-container{perspective:1200px;width:100%;margin:20px 0 25px}
.hero-3d{transform-style:preserve-3d;animation:hero-3d-spin 16s cubic-bezier(0.4,0,0.2,1) infinite;display:flex;flex-direction:column;align-items:center;gap:18px}
@keyframes hero-3d-spin{
0%,100%{transform:rotateX(18deg) rotateY(-22deg) translateZ(0)}
33%{transform:rotateX(-12deg) rotateY(26deg) translateZ(50px)}
66%{transform:rotateX(-24deg) rotateY(-14deg) translateZ(20px)}
}
.hero-moon{transform:translateZ(80px) scale(1.2);border:1px solid rgba(255,255,255,0.25)}
.hero-ey{transform:translateZ(50px);background:rgba(255,255,255,0.06);padding:6px 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.hero-3d .hero{transform:translateZ(65px);filter:drop-shadow(0 2px 0 #5e38a0) drop-shadow(0 6px 0 #3a2264) drop-shadow(0 18px 30px rgba(0,0,0,0.8))}
.hdg{font-size:25px;line-height:1.15;font-weight:400}
.hdg em{font-style:italic;color:var(--rose2)}
.hdg2{font-size:19px;line-height:1.2;font-weight:400}
.ey{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--rose2);font-family:system-ui,sans-serif;font-weight:600}
.body{font-size:14px;line-height:1.8;color:var(--muted);font-family:system-ui,sans-serif;font-weight:300}
.cap{font-size:12px;line-height:1.6;color:var(--soft);font-family:system-ui,sans-serif}
.grad{background:linear-gradient(135deg,var(--rose2),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}

.card.tap:hover{background:var(--s2);border-color:var(--bdg)}
button{font-family:system-ui,sans-serif;cursor:pointer;border:none;background:none;appearance:none}
.btn{width:100%;padding:15px;border-radius:999px;background:linear-gradient(135deg,#8a3558 0%,#5e38a0 100%);color:#fff;font-size:14px;font-weight:600;letter-spacing:.02em;box-shadow:0 10px 26px rgba(130,50,90,0.38),0 4px 10px rgba(0,0,0,0.3);transition:transform .2s,box-shadow .2s}

.btn:active{transform:translateY(1px)}

.btn2{width:100%;padding:14px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);color:var(--text);font-size:13px;font-weight:500;transition:background .2s,border-color .2s}
.btn2:hover{background:var(--s2);border-color:var(--bdg)}
.btn3{width:100%;padding:12px;color:var(--muted);font-size:13px;transition:color .2s}
.btn3:hover{color:var(--text)}
.vs{display:flex;flex-direction:column}
.g4{gap:4px}.g7{gap:7px}.g8{gap:8px}.g10{gap:10px}.g11{gap:11px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}.g20{gap:20px}.g22{gap:22px}.g24{gap:24px}

.pfill{height:100%;background:linear-gradient(90deg,var(--rose2),var(--gold2));border-radius:999px;transition:width .5s ease}
.moon{border-radius:50%;background:radial-gradient(circle at 36% 30%,#f5e6b8 0%,#d4a855 38%,#9a6a30 72%,#6a4020 100%);position:relative;flex-shrink:0;animation:mp 4s ease-in-out infinite}
.moon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 25%,rgba(255,255,255,0.28),transparent 48%)}

.moon.sm{width:50px;height:50px;box-shadow:0 0 18px rgba(201,169,110,0.55)}
@keyframes mp{0%,100%{box-shadow:0 0 30px rgba(201,169,110,0.65),0 0 85px rgba(201,169,110,0.18)}50%{box-shadow:0 0 46px rgba(201,169,110,0.8),0 0 115px rgba(201,169,110,0.25)}}
.ab{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--s1);border:1px solid var(--bdg);box-shadow:0 0 18px var(--rg);flex-shrink:0}
.opt{padding:13px 15px;border-radius:13px;background:var(--s1);border:1px solid var(--bd);color:var(--muted);text-align:left;font-size:13px;line-height:1.5;transition:all .2s;width:100%}
.opt:hover{background:var(--s2);border-color:var(--bdg);color:var(--text)}
.opt.sel{background:rgba(212,133,154,0.12);border-color:rgba(212,133,154,0.48);color:var(--text);box-shadow:0 0 14px var(--rg)}
.trow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;font-family:system-ui,sans-serif}
.ttrack{height:5px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden}
.tfill{height:100%;background:linear-gradient(90deg,var(--rose2),var(--gold2));border-radius:999px;transition:width 1.2s ease}
.jinput{width:100%;background:var(--s1);border:1px solid var(--bd);color:var(--text);padding:14px;border-radius:13px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.72;outline:none;resize:none;min-height:120px;transition:border-color .2s}

.entry{padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--bd)}
.etop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ewho{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose2);font-family:system-ui,sans-serif}
.eday{font-size:10px;color:var(--soft);font-family:system-ui,sans-serif}
.etxt{font-size:13px;line-height:1.78;color:var(--muted);font-style:italic}
.scard{padding:14px;border-radius:13px;background:var(--s1);border:1px solid var(--bd);text-align:center}
.snum{font-size:28px;font-weight:700;color:var(--rose2);line-height:1}
.slbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:4px;font-family:system-ui,sans-serif}
.cring{position:relative;width:108px;height:108px;flex-shrink:0}
.cring svg{width:100%;height:100%;transform:rotate(-90deg)}
.crc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cnum{font-size:24px;font-weight:700;color:var(--rose2);line-height:1}
.clbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:2px;font-family:system-ui,sans-serif}
.chip{padding:6px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--bd);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-family:system-ui,sans-serif}
.chip.r{border-color:var(--bdg);color:var(--rose2);background:rgba(212,133,154,0.08)}
.chip.fr{border-color:rgba(126,200,160,0.28);color:var(--green);background:rgba(126,200,160,0.07)}
.tb{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:system-ui,sans-serif}
.tb.fr{background:rgba(126,200,160,0.1);border:1px solid rgba(126,200,160,0.24);color:var(--green)}
.tb.pd{background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.24);color:var(--gold2)}
.ifield{width:100%;background:var(--s1);border:1px solid var(--bd);color:var(--text);padding:13px 14px;border-radius:13px;font-family:system-ui,sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.ifield:focus{border-color:var(--bdg)}
.ifield::placeholder{color:var(--soft)}
.flbl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:5px;font-family:system-ui,sans-serif}
.yb{padding:10px 8px;border-radius:11px;background:var(--s1);border:1px solid var(--bd);font-size:12px;color:var(--muted);font-family:system-ui,sans-serif;transition:all .2s}
.yb.on{background:rgba(212,133,154,0.12);border-color:rgba(212,133,154,0.42);color:var(--text)}
.hi{padding:13px;border-radius:13px;background:var(--s1);border:1px solid var(--bd);display:flex;gap:11px;align-items:flex-start;transition:all .2s;cursor:pointer}
.hi:hover,.hi.sel{background:var(--s2);border-color:var(--bdg)}
.hi.sel{box-shadow:0 0 14px var(--rg)}
.hic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--s2);border:1px solid var(--bd)}
.phases{display:flex;gap:5px;align-items:flex-end;justify-content:center;padding:5px 0}
.ph{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.04);border:1px solid var(--bd);flex-shrink:0}
.ph.done{background:radial-gradient(circle at 35% 30%,#e4c88a,#c9a96e);border-color:rgba(201,169,110,0.5);box-shadow:0 0 6px rgba(201,169,110,0.45)}
.ph.cur{background:linear-gradient(90deg,#e4c88a 50%,rgba(255,255,255,0.04) 50%);border-color:rgba(201,169,110,0.5)}
.phn{font-size:8px;color:var(--soft);text-align:center;margin-top:3px;font-family:system-ui,sans-serif}
.sep{height:1px;background:var(--bd);margin:5px 0}
.gline{height:1px;background:linear-gradient(90deg,transparent,var(--rose2),transparent);opacity:.35;margin:8px 0}
.prow{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.prow:last-child{border:none}
.pbull{width:19px;height:19px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:10px;margin-top:1px}
.pbull.fr{background:rgba(126,200,160,0.15);border:1px solid rgba(126,200,160,0.3);color:var(--green)}
.pbull.pd{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.28);color:var(--gold)}
.rorb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.07),rgba(120,80,180,0.04));border:1px solid rgba(255,255,255,0.055);display:grid;place-items:center;animation:orbp 6s ease-in-out infinite}
@keyframes orbp{0%,100%{box-shadow:0 0 65px rgba(201,169,110,0.12)}50%{box-shadow:0 0 100px rgba(201,169,110,0.22),0 0 200px rgba(120,80,180,0.1)}}
.bnav{display:flex;align-items:center;justify-content:space-around;padding:11px 0 13px;margin-top:auto;background:linear-gradient(to top,rgba(7,5,17,0.98) 55%,transparent);position:sticky;bottom:0;flex-shrink:0}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:13px;cursor:pointer;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-family:system-ui,sans-serif;transition:color .2s;flex:1;max-width:62px}
.ni svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.4;transition:opacity .2s}
.ni.on{color:var(--rose2)}.ni.on svg{opacity:1}
#bc{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(200,120,150,0.13),rgba(120,80,180,0.04));border:2px solid var(--bdg);display:grid;place-items:center;margin:0 auto 13px;transition:transform 4s ease-in-out;box-shadow:0 0 24px var(--rg)}
@keyframes fadein{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:translateY(0)}}
.fin{animation:fadein .44s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.10s}.d3{animation-delay:.15s}.d4{animation-delay:.20s}.d5{animation-delay:.25s}.d6{animation-delay:.32s}
@media(max-width:440px){body{align-items:flex-start}.shell{max-width:100%}}
</style>

<script>
(function(){
  var c=document.getElementById('sf');
  var ks='@keyframes tw{0%{opacity:0.05}100%{opacity:0.7}}';
  var s=document.createElement('style');s.textContent=ks;document.head.appendChild(s);
  for(var i=0;i<80;i++){
    var d=document.createElement('div');d.className='st';
    var sz=Math.random()*1.6+0.3;
    var dur=(2+Math.random()*5).toFixed(1);
    var del=(Math.random()*7).toFixed(1);
    d.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;animation:tw '+dur+'s '+del+'s ease-in-out infinite alternate';
    c.appendChild(d);
  }
})();

var SK='mp-v3';
var DEF={sc:'home',qi:0,ans:null,arch:null,day:4,streak:4,mood:null,draft:'',revwant:false,conf:72,name:'You',yr:'2nd',rmode:null};
function freshState(){var d=JSON.parse(JSON.stringify(DEF));d.ans=Array(11).fill(null);return d;}
var S=loadS();
function loadS(){try{var v=JSON.parse(localStorage.getItem(SK)||'null');if(v){if(!v.ans||!Array.isArray(v.ans))v.ans=Array(11).fill(null);return Object.assign({},freshState(),v);}return freshState();}catch(e){return freshState();}}
function sv(){try{localStorage.setItem(SK,JSON.stringify(S));localStorage.setItem(SK+'-entries',JSON.stringify(ENTRIES));}catch(e){}}
function rst(){S=freshState();ENTRIES=DEF_ENTRIES.slice();sv();go('home');}

var QS=[
  {t:'When a message stays unread for hours, your mind goes to\u2026',o:['They\'re just busy.','Maybe I said something off.','They\'re losing interest.','I should stop reaching out.'],ax:'rejection'},
  {t:'At social events you usually\u2026',o:['Start conversations naturally.','Wait until someone approaches.','Stay near one safe person.','Leave early if it feels like too much.'],ax:'avoidance'},
  {t:'Sharing how you really feel with someone new feels\u2026',o:['Natural.','A little risky.','Very uncomfortable.','Almost impossible.'],ax:'vulnerability'},
  {t:'If someone is warm for 3 days and distant on day 4, you\u2026',o:['Assume it\'s normal variation.','Notice but stay calm.','Replay everything in my head.','Pull back before they can.'],ax:'rejection'},
  {t:'How easy is it for you to ask for help?',o:['Very easy.','Sometimes hard.','Rarely do it.','I almost always avoid it.'],ax:'readiness'},
  {t:'What hurts more?',o:['Being misunderstood.','Being left out.','Feeling like too much.','Feeling invisible.'],ax:'rejection'},
  {t:'When you want connection, you usually\u2026',o:['Reach out directly.','Wait for the right moment.','Hope someone notices.','Tell myself I don\'t need it.'],ax:'avoidance'},
  {t:'"People only stay if I stay useful, easy, or impressive." How true?',o:['Not true at all.','A little true.','Often feels true.','Painfully true.'],ax:'rejection'},
  {t:'Someone asks what\'s really going on with you. You\u2026',o:['Tell them honestly.','Give a softer version.','Joke and deflect.','Change the topic fully.'],ax:'vulnerability'},
  {t:'How would you describe your social identity?',o:['I connect easily and deeply.','I care but protect myself.','I long for closeness and fear it.','I disappear before anyone can leave.'],ax:'blend'},
  {t:'How ready are you for consistent emotional honesty?',o:['Fully ready.','Mostly ready.','Curious but scared.','I want it, but I might run.'],ax:'readiness'},
];

var ARCH={
  quiet:{em:'🌙',name:'Quiet Observer',line:'You feel deeply. Your inner world speaks first.',desc:'You notice everything. Thoughtful, careful, slow to trust. You want connection \u2014 but safety always comes first.',traits:{Depth:88,Protection:75,Openness:42,Resilience:65},prompts:['What did you hide today because it felt too small to explain?','What do you wish someone noticed without you having to say it?']},

  invisible:{em:'🌫️',name:'Invisible Performer',line:'You learned to cope by becoming easy, useful, or unreadable.',desc:'You keep others comfortable while your own feelings stay hidden. You are more lonely than most people know.',traits:{Depth:82,Protection:70,Openness:38,Resilience:58},prompts:['What are you tired of carrying alone?','Where do you make yourself smaller to stay accepted?']},
  open:{em:'💫',name:'Open-hearted Signal',line:'You\'re emotionally available. You still need depth that lasts.',desc:'You\'re willing to try, reach out, feel things honestly. Your challenge is finding people who can truly meet you at your level.',traits:{Depth:68,Protection:45,Openness:90,Resilience:80},prompts:['What kind of connection are you ready for right now?','What does emotional effort mean to you?']},
};

var DEF_ENTRIES=[
  {day:3,mood:'🌙',txt:'Today I looked completely normal on the outside, but felt weirdly invisible in a room full of people I actually like.'},
  {day:2,mood:'🪞',txt:'I kept wondering if anyone would notice if I stopped reaching out first.'},
  {day:1,mood:'✨',txt:'I wanted to text someone tonight but didn\'t know who would actually understand.'},
];

  el.innerHTML=render(id);
  el.scrollTop=0;
  el.classList.add('show');
  S.sc=id;sv();
}

function render(id){
  if(id==='home')return rHome();
  if(id==='mirror')return rMirror();
  if(id==='scan')return rScan();
  if(id==='result')return rResult();
  if(id==='reset')return rReset();

function pickAns(i){
  S.ans[S.qi]=i;sv();
  document.querySelectorAll('.opt').forEach(function(el,idx){el.classList.toggle('sel',idx===i);});
  var nb=document.getElementById('nb');if(nb)nb.disabled=false;
  var note=document.querySelector('.cap[style*="rose"]');if(note)note.remove();
}
function nextQ(){if(S.ans[S.qi]===null)return;if(S.qi<QS.length-1){S.qi++;sv();go('scan');}else{calcArch();go('result');}}
function prevQ(){if(S.qi>0){S.qi--;sv();go('scan');}}
function calcArch(){
  var sc={rejection:0,avoidance:0,vulnerability:0,readiness:0,blend:0};
  QS.forEach(function(q,i){if(S.ans[i]!==null)sc[q.ax]=(sc[q.ax]||0)+S.ans[i];});
  var r=(sc.rejection||0)/12,a=(sc.avoidance||0)/9,v=(sc.vulnerability||0)/6,rd=(sc.readiness||0)/6;
  if(r+a+v<1.5&&rd<0.5)S.arch='open';
  else if(r>0.6)S.arch=v>0.5?'invisible':'guarded';
  else if(a>0.6)S.arch='quiet';
  else S.arch='guarded';
  S.qi=0;S.ans=Array(11).fill(null);sv();
}

function startBreath(){
  var bc=document.getElementById('bc'),bl=document.getElementById('bl');
  if(!bc||!bl)return;
  var ph=['Inhale','Hold','Exhale','Hold'];
  var i=0,r=0;bl.textContent='Starting\u2026';
  var tick=function(){
    if(r>=4){bl.textContent='Done \u2736';bc.style.transform='scale(1)';return;}
    bl.textContent=ph[i];
    bc.style.transform=(i===0||i===1)?'scale(1.2)':'scale(1)';
    i=(i+1)%4;if(i===0)r++;
    setTimeout(tick,4000);
  };
  setTimeout(tick,300);
}

function sealEntry(){
  if(S.draft.trim().length>8){ENTRIES.unshift({day:S.day,mood:S.mood||'🌙',txt:S.draft});S.draft='';S.day++;S.streak++;S.conf=Math.min(100,S.conf+2);sv();go('journal');}
}

  return '<div class="topbar fin"><button class="pb" onclick="go(\'home\')">&#8592;</button><div class="wm">your room</div><div style="width:48px"></div></div>'+
  '<div class="vs g20" style="flex:1;padding-bottom:8px">'+
  '<div class="fin d1"><div class="ey" style="margin-bottom:7px">Anonymous Exchange</div><div class="hdg">21 nights.<br><em>One reveal.</em></div><div class="body" style="font-size:13px;margin-top:8px">Your writing partner is matched by emotional pattern. Names are sealed until Day 21.</div></div>'+
  '<div class="card fin d2" style="text-align:center;padding:20px">'+
  '<div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:13px">'+

  '<div style="color:var(--rose2);font-size:16px">&#10022;</div>'+
  '<div style="text-align:center"><div class="ab" style="margin:0 auto 5px;filter:blur(2px);background:var(--s1);border-color:rgba(255,255,255,0.05);box-shadow:none">?</div><div class="cap">Partner</div></div>'+

  '<div class="fin d3"><div class="ey" style="margin-bottom:8px">From your room</div><div class="vs g8">'+
  ENTRIES.map(function(e){return '<div class="entry" style="border-color:rgba(120,80,180,0.2)"><div class="etop"><div class="ewho" style="color:var(--purple)">&#10022; Night '+e.day+'</div><div class="eday">Partner</div></div><div class="etxt">'+esc(e.txt)+'</div></div>';}).join('')+
  '</div></div>'+
  '<div class="card gld fin d4" style="text-align:center;padding:20px"><div class="ey" style="margin-bottom:6px;color:var(--gold2)">Day 21 Reveal</div>'+
  '<div style="font-size:36px;font-weight:700;color:var(--gold2);line-height:1;margin-bottom:3px">'+Math.max(0,21-S.day)+'</div>'+
  '<div class="cap">nights remaining</div>'+
  '<div class="body" style="font-size:12px;margin-top:10px">On Day 21, you can both choose to reveal your names. Only if both say yes.</div>'+
  '<button class="btn2" style="margin-top:13px" onclick="go(\'reveal\')">Preview the Reveal &rarr;</button></div>'+
  '</div>'+bnav('');
}

// ── ME ──
function rMe(){
  var a=S.arch?ARCH[S.arch]:null;
  return '<div class="topbar fin"><div class="wm">me</div><div class="pb" onclick="go(\'plan\')">&#10022; Plan</div></div>'+
  '<div class="vs g20" style="flex:1;padding-bottom:8px">'+
  '<div class="card fin d1" style="text-align:center;padding:20px">'+
  '<div style="width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,rgba(200,100,130,0.28),rgba(120,80,180,0.18));border:1px solid var(--bdg);display:grid;place-items:center;margin:0 auto 10px;font-size:28px">'+(a?a.em:'🌙')+'</div>'+
  '<div style="font-size:19px;margin-bottom:3px">'+esc(S.name)+'</div>'+
  '<div class="cap">'+S.yr+' year &middot; '+(a?a.name:'Not scanned yet')+'</div></div>'+
  '<div class="g2 fin d2">'+
  '<div class="scard"><div class="snum">'+S.day+'</div><div class="slbl">Day Streak</div></div>'+
  '<div class="scard"><div class="snum">'+S.conf+'</div><div class="slbl">Confidence</div></div>'+
  '<div class="scard"><div class="snum">'+ENTRIES.length+'</div><div class="slbl">Entries</div></div>'+
  '<div class="scard"><div class="snum">'+Math.max(0,21-S.day)+'</div><div class="slbl">Days Left</div></div>'+
  '</div>'+
  '<div class="card fin d3"><div class="ey" style="margin-bottom:12px">Your Details</div>'+
  '<div class="vs g10">'+
  '<div><label class="flbl">Name</label><input class="ifield" value="'+esc(S.name)+'" oninput="S.name=this.value;sv()"/></div>'+

}

function setYr(y){S.yr=y;sv();document.querySelectorAll('.yb').forEach(function(el){var v=(el.getAttribute('onclick')||'').match(/'([^']+)'/);if(v)el.classList.toggle('on',v[1]===y);});}
