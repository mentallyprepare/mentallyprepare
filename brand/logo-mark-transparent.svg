<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 266 624 408" width="624" height="408">
  <!-- Mark alone, for dark surfaces. Flat color only: edit hexes directly. -->
  <defs>
    <radialGradient id="moon" cx="36%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#B4A8F4"/>
      <stop offset="100%" stop-color="#413670"/>
    </radialGradient>
  </defs>
  <!-- Ring, back half (passes behind the moon) -->
  <g transform="rotate(-14 512 470)">
    <path d="M 212 470 A 300 88 0 0 1 812 470" fill="none" stroke="#453E75" stroke-width="13" stroke-linecap="round"/>
  </g>
  <circle cx="512" cy="470" r="190" fill="url(#moon)"/>
  <!-- Ring, front half -->
  <g transform="rotate(-14 512 470)">
    <path d="M 212 470 A 300 88 0 0 0 812 470" fill="none" stroke="#DDD6FF" stroke-width="13" stroke-linecap="round"/>
  </g>
  <!-- Tonight's entry -->
  <circle cx="704" cy="348" r="9" fill="#EFEAFF"/>
</svg>
